# Written reasons for numbers flagged 'check by hand' in the number tests. From the filing (F) or company (C). Updated 2026-10-03.
GOOGL:
  net_income: "[F] Net profit $112.2bn vs operating income $40.8bn because other income was $97,983m, almost all 'net gains on equity securities of $99.0 billion, primarily related to unrealized gains in our equity securities portfolio from SpaceX and a private company'. Paper gains; true earnings strip them. https://www.sec.gov/Archives/edgar/data/1652044/000165204426000071/goog-20260630.htm"
QBTS:
  rd: "[F] R&D rose $15.5m to $28.2m, 'primarily driven by increases in personnel costs of $5.2 million, depreciation and amortization expense of $4.1 million and stock-based compensation expense of $2.9 million', after the Quantum Circuits acquisition (closed 20 Jan 2026, $538.5m consideration). Split by business not disclosed. https://www.sec.gov/Archives/edgar/data/1907982/000190798226000129/qbts-20260630.htm"
  net_income: "[F] Q2 net loss $48.0m vs operating loss $53.3m because of $5.0m interest income and $0.5m other income; no investment gains. Half-year loss also cut by a one-off $28.4m acquisition-related tax benefit, which true earnings strip. https://www.sec.gov/Archives/edgar/data/1907982/000190798226000129/qbts-20260630.htm"
ALAB:
  net_income: "[F] Net profit $153.1m is above pre-tax $102.8m because of a $50.3m income tax BENEFIT (the -50,263,000 tax line), 'primarily due to an increase in excess tax benefits related to equity compensation'; interest and other income added $13.6m. True earnings should start from operating profit ($89.2m). https://www.sec.gov/Archives/edgar/data/1736297/000173629726000035/alab-20260630.htm"
CBRS:
  rd: "[F] R&D rose $259.4m (427%), 'primarily attributable to $228.0 million of IPO-related stock-based compensation and related tax costs' that vested at the May 2026 listing, plus headcount and next-generation programs. Stock pay is a cost; the $228.0m catch-up is a one-time step. https://www.sec.gov/Archives/edgar/data/2021728/000162828026056357/cbrs-20260630.htm"
SNDK:
  revenue: "[C] Q4 revenue $8,965m vs $5,950m in Q3 (both 13-week quarters): 'Sequential revenue growth came approximately one-third from higher volumes and two-thirds from higher pricing'. A NAND price surge, not an acquisition. https://www.sec.gov/Archives/edgar/data/2023554/000162828026053346/sndkq4-26ex991xpressrelease.htm ; pricing confirmed in the 10-K [F] https://www.sec.gov/Archives/edgar/data/2023554/000162828026057406/sndk-20260703.htm"
DELL:
  net_income: "[F] Not a restatement; no 8-K item 4.02. The FY2025 10-K made an immaterial 'revision' for 'accumulated credits from certain suppliers that were not recorded or not recorded in the correct period' (e.g. the quarter to 1 Nov 2024 moved from $1,132m to $1,175m). Dell disclosed a material weakness then; the FY2026 10-K no longer reports one. https://www.sec.gov/Archives/edgar/data/1571996/000157199625000034/dell-20250131.htm"
AMZN:
  net_income: "[F] Q2 2026 other income $53,415m against operating income $27,461m; $50,486m was 'upward adjustments relating to equity investments in private companies', 'primarily' Amazon's nonvoting preferred stock in Anthropic. A non-cash revaluation, not operating earnings; true earnings strip it. https://www.sec.gov/Archives/edgar/data/1018724/000101872426000026/amzn-20260630.htm"
APO:
  revenue: "[F] Q2 2026 revenue $11,153m vs about $5,059m in Q1 (six-month $16,212m less Q2). Mostly Athene 'investment related gains (losses)': +$2,989m in Q2 vs about -$2,078m in Q1, credited to hedging-derivative fair value changes, FX gains and a $673 million gain on the AP Grange call. Mark-to-market, not fee growth. https://www.sec.gov/Archives/edgar/data/1858681/000185868126000040/apo-20260630.htm"
AXTI:
  revenue: "[F] Q2 2026 revenue $47,589k vs about $26,924k in Q1 (six-month $74,513k less Q2). Company: 'higher demand for InP wafer substrates used for data center applications and in passive optical networks, as a result of additional export approvals granted by the China government'. Growth depends on Chinese export permits. https://www.sec.gov/Archives/edgar/data/1051627/000143774926027677/axti20260630_10q.htm"
CEG:
  revenue: "[F] Q2 2026 revenue $7,504m vs about $11,122m in Q1. No sequential reason given; the revenue table shows unrealised hedge results inside revenue of -$320m in Q2 vs about +$1,315m in Q1, and MD&A names 'unfavorable net unrealized losses on economic hedges' and nuclear outages. Mostly mark-to-market, not lost business. https://www.sec.gov/Archives/edgar/data/1868275/000186827526000104/ceg-20260630.htm"
MU:
  revenue: "[F] 'Total revenue for the third quarter of 2026 increased 74% as compared to the second quarter of 2026, primarily due to increases in sales of both DRAM and NAND products' - DRAM on a 'low-60% range increase in average selling prices', NAND on a 'mid-80% range increase'. Price-driven, volumes up only slightly. https://www.sec.gov/Archives/edgar/data/723125/000072312526000015/mu-20260528.htm . Newer results 8-K (30 Sep 2026): FQ4 revenue $54,229m. https://www.sec.gov/Archives/edgar/data/723125/000072312526000018/a2026q4ex991-pressrelease.htm"
WDC:
  net_income: "[F] Q4 FY26 operating income $1,563m vs net income $3,195m; FY26 'mark-to-market gain on our retained interest in Sandisk' of $6,498m (about $2,050m in Q4). WDC held no Sandisk shares at 3 July 2026, so it will not recur; true earnings strip it. https://www.sec.gov/Archives/edgar/data/106040/000162828026057139/wdc-20260703.htm"
  revenue: "[F] Re-cast for the Sandisk (Flash) separation, not a restatement: figures 'presented on a continuing operations basis to reflect the impact of the separation of the Company's Flash business'. No 8-K item 4.02 found. KPMG FY26 opinion clean, internal controls effective, no auditor change. https://www.sec.gov/Archives/edgar/data/106040/000162828026057139/wdc-20260703.htm"
