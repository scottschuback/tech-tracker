name: Daily tracker run
on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC = 7:00am AEDT (6:00am AEST). Change to suit.
  workflow_dispatch:
    inputs:
      backfill:
        description: "Seed the alert scoreboard from past filings (first run only)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: { group: tracker, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Test the number checks before trusting any numbers
        run: python -m pytest -q
      - name: Run the tracker
        env:
          TRACKER_USER_AGENT: ${{ secrets.TRACKER_USER_AGENT }}
          PATENTSVIEW_API_KEY: ${{ secrets.PATENTSVIEW_API_KEY }}
        run: python -m tracker.run ${{ inputs.backfill && '--backfill' || '' }}
      - name: Save results and publish the app
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data docs
          git commit -m "Daily run $(date -u +%F)" || echo "nothing new"
          git pull --rebase -X ours || true
          git push
      - name: Send the email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          APP_URL: ${{ vars.APP_URL }}
        run: python -m tracker.email_digest
