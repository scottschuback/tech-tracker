# The 20 layers of the AI build, plus the buyers. alert: all | red_only | watch (major news only)
# status = business grade (our judgement from the 3 Oct 2026 research, reviewed by the routine). "ungraded" until researched.
- id: gpu
  name: GPUs
  alert: all
  what: "General-purpose AI chips that train and run models. The biggest single spend in every AI data centre."
  tickers: {NVDA: lead, AMD: gain, INTC: lose}
  offline: {}
  timeline: [["Vera Rubin racks shipping",2026.6,2027.2,"lead"],["AMD Helios rack ramp",2026.7,2027.5,"gain"],["Rubin Ultra Kyber NVL576",2027.5,2028.2,"gain"],["Nvidia Feynman (A16, 3D stacking)",2028,2028.9,"gain"]]
