# Every source the tracker knows about. live = runs daily now. planned = shown in the app as not connected yet.
live:
  sec_filings: "SEC EDGAR filings for every watchlist company (8-K items, 10-Q, 10-K, 6-K, 20-F, F-1, 13D, late filings)"
  sec_numbers: "Company XBRL numbers, double-pulled against the filing text and tested"
  sec_fulltext: "EDGAR full-text search for supply-lock phrases (warrants, purchase commitments, prepayments)"
  sec_form_d: "Private chip and AI-hardware startups raising money (Form D)"
  federal_register: "US rules and notices: Commerce BIS export controls, Entity List, chip programs"
  usaspending: "Federal contracts and grants into chips, packaging, photonics, CHIPS Act"
  patents: "New patent grants in AI hardware, packaging, memory, optics, power (needs free key)"
  promises: "Promise ledger: dated company promises, checked daily for due and overdue"
  prices: "Daily share prices (Yahoo Finance public chart endpoint, free). UNTESTED until the first GitHub run proves it. Used only for the 'price down, filings strong' alert and backtests, never in the verdict"
  discovery: "Companies not on the watchlist whose filings start mentioning HBM, co-packaged optics, AI accelerators, liquid cooling or the big buyers"
  movers: "Movers: verdict changes, guidance raised or cut, backlog up 15%+, supply deals naming big customers, the turn, insider buying, promises delivered early, price down while filings strong"
planned:
  korea_dart: "Samsung and SK hynix home filings (needs free DART key)"
  korea_trade: "Korea chip exports every 10 and 20 days (earliest memory volume signal)"
  taiwan_trade: "Taiwan monthly exports"
  us_trade: "US Census chip and server imports (HS 8542, 8471)"
  fcc: "FCC equipment authorisations (new devices before launch)"
  grid_queues: "ERCOT and PJM large-load queues; EIA data-centre demand"
  epa_permits: "EPA air permits for on-site data-centre turbines"
  mlperf: "MLPerf independent benchmark results"
  standards: "JEDEC, UALink, OCP, Ultra Ethernet spec releases"
  itc_337: "ITC Section 337 import-ban cases on chips"
  software_moat: "CUDA vs ROCm activity and framework support"
  gpu_rental: "GPU hourly rental prices (R tag)"
  china_controls: "China export controls on gallium, germanium, rare earths"
